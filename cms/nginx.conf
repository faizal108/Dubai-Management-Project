server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy API calls to the backend container on the docker-compose
  # network, for local/demo setups that build with a relative
  # VITE_API_BASE_URL=/api/v1 (same-origin, works behind any tunnel hostname).
  #
  # In Azure Container Apps (and any deploy where frontend/backend are
  # separate apps/hosts) VITE_API_BASE_URL is baked in as an absolute URL at
  # build time, so the SPA calls the backend directly and this block is never
  # hit. It must still not break container startup when "backend" doesn't
  # resolve, so the upstream is resolved lazily via $backend_upstream + the
  # Docker embedded DNS resolver instead of a static proxy_pass target (which
  # nginx would try to resolve at startup and fail on).
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/v1/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
