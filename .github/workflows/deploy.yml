name: Deploy to Azure App Service

# Builds only the side(s) that changed on every push to main, pushes to ACR,
# and updates the matching Web App for Containers. See infra/README.md for
# one-time setup — this workflow assumes scripts/azure-bootstrap.sh has
# already run and the repo variables it prints (AZURE_CLIENT_ID,
# ACR_LOGIN_SERVER, etc.) are set.
#
# Backend migrations + seed run automatically on container start
# (RUN_MIGRATIONS_ON_START / RUN_SEED_ON_START app settings, both
# idempotent) — there's no separate migration step here. This workflow
# restarts the backend after updating its image, then polls /api/v1/health
# so a failed migration (crash-looping container) fails the deploy instead
# of silently leaving the old version running.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button — always builds/deploys both sides,
    # bypassing the path filter below. Useful for the first-ever deploy (replacing
    # the placeholder image) or to force a redeploy with no code change.

# Only one deploy in flight at a time; never cancel a deploy mid-flight.
concurrency:
  group: azure-deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'cms/**'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build & push backend image
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/donation-backend:${{ github.sha }}"
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update backend Web App image
        run: |
          az webapp config container set \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "$IMAGE"
          az webapp restart \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"

      - name: Wait for healthy backend (migrations run on this restart)
        run: |
          URL="${{ vars.BACKEND_API_BASE_URL }}/health"
          echo "Polling $URL"
          for i in $(seq 1 30); do
            if curl -sf "$URL" >/dev/null; then
              echo "Backend healthy."
              exit 0
            fi
            echo "  not ready yet ($i/30)"
            sleep 10
          done
          echo "Backend did not become healthy in time — check migration/startup logs:"
          echo "  az webapp log tail --name ${{ vars.BACKEND_APP_NAME }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}"
          exit 1

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build & push frontend image
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/donation-frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.BACKEND_API_BASE_URL }}" \
            -t "$IMAGE" ./cms
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update frontend Web App image
        run: |
          az webapp config container set \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "$IMAGE"
          az webapp restart \
            --name "${{ vars.FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
